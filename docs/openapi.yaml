components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Send the exact value Device <token>.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Stable error envelope; request ID supports safe support correlation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        community: { type: string, minLength: 1, maxLength: 120 }
        preferredLanguage: { type: string, minLength: 2, maxLength: 12 }
        cooperative: { type: string, nullable: true, maxLength: 160 }
        smsConsent: { type: boolean }
        smsOptOut: { type: boolean }
        quietHoursStart:
          { type: string, nullable: true, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        quietHoursEnd:
          { type: string, nullable: true, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
    Success:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { type: object }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: {} }
            requestId: { type: string }
    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, SUCCESSFUL, FAILED, EXPIRED, INITIATION_UNKNOWN]
    Payment:
      type: object
      required:
        [
          id,
          reference,
          offerId,
          amount,
          currency,
          provider,
          mode,
          checkoutUrl,
          status,
          failureCode,
          createdAt,
          updatedAt,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, format: uuid }
        offerId: { type: string, format: uuid }
        amount: { type: integer, minimum: 100, description: Exact XAF amount; no fractional units }
        currency: { type: string, enum: [XAF] }
        provider: { type: string, enum: [FAPSHI, MOCK] }
        mode: { type: string, enum: [sandbox, live, simulated] }
        checkoutUrl: { type: string, format: uri, nullable: true }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        failureCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    Register:
      type: object
      required: [displayName, password, role, community]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        role: { type: string, enum: [FARMER, BUYER] }
        community: { type: string }
        preferredLanguage: { type: string, default: en }
        smsConsent: { type: boolean, default: false }
    BatchStatus:
      type: string
      enum: [STORED, LISTED, PARTIALLY_SOLD, SOLD, SPOILED, ARCHIVED]
    Unit:
      type: string
      enum: [KG, CRATE, PIECE]
    CreateBatch:
      type: object
      required: [cropId, harvestAt, quantity, unit, community, storageMethod]
      properties:
        cropId: { type: string, format: uuid }
        harvestAt: { type: string, format: date-time }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/Unit' }
        community: { type: string }
        storageMethod: { type: string, enum: [COOLER, SHADED_CONTROL, OTHER] }
        storageUnitId: { type: string, format: uuid }
        trialGroupId: { type: string, format: uuid }
        clientOperationId: { type: string, format: uuid }
    Reading:
      type: object
      required: [batchId, recordedAt, temperatureC, relativeHumidityPercent]
      properties:
        batchId: { type: string, format: uuid }
        storageUnitId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        temperatureC: { type: number, minimum: -10, maximum: 60 }
        relativeHumidityPercent: { type: number, minimum: 0, maximum: 100 }
        source: { type: string, enum: [MANUAL, SENSOR, SIMULATED], default: MANUAL }
        clientOperationId: { type: string, format: uuid }
    PriceObservation:
      type: object
      required: [cropId, marketId, amount, currency, unit, observedAt, source]
      properties:
        cropId: { type: string, format: uuid }
        marketId: { type: string, format: uuid }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit: { $ref: '#/components/schemas/Unit' }
        observedAt: { type: string, format: date-time }
        source: { type: string, minLength: 3, maxLength: 250 }
        clientOperationId: { type: string, format: uuid }
    PriceAlertRule:
      type: object
      required: [cropId, marketId, targetAmount, currency, unit, condition]
      properties:
        cropId: { type: string, format: uuid }
        marketId: { type: string, format: uuid }
        targetAmount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit: { $ref: '#/components/schemas/Unit' }
        condition: { type: string, enum: [AT_OR_ABOVE, AT_OR_BELOW] }
        active: { type: boolean, default: true }
    Listing:
      type: object
      required: [batchId, quantity, unit, availableUntil, collectionArea]
      properties:
        batchId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.001 }
        unit: { $ref: '#/components/schemas/Unit' }
        askingPrice: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        availableFrom: { type: string, format: date-time }
        availableUntil: { type: string, format: date-time }
        collectionArea: { type: string, maxLength: 180 }
        contactPreference: { type: string, enum: [IN_APP, PHONE_AFTER_REQUEST] }
        contactConsent: { type: boolean, default: false }
        clientOperationId: { type: string, format: uuid }
    Offer:
      type: object
      required: [quantity, unit]
      properties:
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.001 }
        unit: { $ref: '#/components/schemas/Unit' }
        offeredPrice: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        message: { type: string, maxLength: 1000 }
        clientOperationId: { type: string, format: uuid }
    QualityObservation:
      type: object
      required:
        [batchId, observedAt, discardedQuantity, unit, firmness, visibleMold, leakage, shriveling]
      properties:
        batchId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        discardedQuantity: { type: number, minimum: 0, multipleOf: 0.001 }
        unit: { $ref: '#/components/schemas/Unit' }
        firmness: { type: string, enum: [FIRM, SOFT, MIXED, NOT_ASSESSED] }
        visibleMold: { type: boolean }
        leakage: { type: boolean }
        shriveling: { type: boolean }
        qualityScore: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, maxLength: 2000 }
        clientOperationId: { type: string, format: uuid }
